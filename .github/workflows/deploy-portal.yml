name: Deploy Angular Portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'recipe-portal/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: recipe-portal/package-lock.json

      - name: Install dependencies
        run: |
          npm install
          npm install lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Build Angular (production)
        run: npx ng build --configuration production --base-href "/recipe/"

      - name: SPA 404 fallback
        run: cp dist/recipe-portal/browser/index.html dist/recipe-portal/browser/404.html

      - name: Add .nojekyll
        run: touch dist/recipe-portal/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: recipe-portal/dist/recipe-portal/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
